# ─────────────────────────────────────────────────────────────────
# CODAS Docker NGINX Configuration  
# Used inside docker-compose.prod.yml where backend runs as 4 replicas
# NGINX resolves 'backend' to all container IPs via Docker DNS
# ─────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    keepalive_timeout   65;
    client_body_timeout 30;
    client_header_timeout 30;
    send_timeout 30;
    client_max_body_size 15M;

    # ── GZIP ──
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml image/svg+xml;

    # ── Logging ──
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log main buffer=16k flush=5s;
    error_log  /var/log/nginx/error.log warn;

    # ── Rate Limiting ──
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/s;
    limit_req_zone $binary_remote_addr zone=admin:10m   rate=1r/s;

    # ── Upstreams (Docker service discovery) ──
    upstream backend_cluster {
        least_conn;
        server backend:3000;    # Docker resolves to all 4 replicas automatically
        keepalive 64;
    }

    upstream python_cluster {
        least_conn;
        server python-service:8001;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # ── SSL (uncomment after certbot) ──
        # listen 443 ssl http2;
        # ssl_certificate     /etc/letsencrypt/live/app.codas.me/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/app.codas.me/privkey.pem;

        # ── Security Headers ──
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Frontend SPA ──
        location / {
            root /var/www/codas/frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # ── API Proxy ──
        location /api/ {
            limit_req zone=general burst=40 nodelay;
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
        }

        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Admin ──
        location /admin/ {
            limit_req zone=admin burst=3 nodelay;
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Python Internal (backend-only) ──
        location /internal/ {
            allow 172.16.0.0/12;  # Docker internal network
            deny all;
            proxy_pass http://python_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
        }

        location ~ /\. { deny all; access_log off; }
    }
}
