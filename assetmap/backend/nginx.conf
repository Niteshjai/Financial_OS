# ─────────────────────────────────────────────────────────────────────
# CODAS Production NGINX Configuration
# Handles: Load Balancing, Static Serving, Reverse Proxy, SSL-ready
# Designed for 2000+ concurrent users
# ─────────────────────────────────────────────────────────────────────

# ── Worker tuning ──
# auto = one worker per CPU core (e.g. 4-core VM = 4 workers)
worker_processes auto;

# Each worker can hold this many simultaneous connections
# 2000 users × 2 connections avg = 4096 is safe headroom
events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ── Basic settings ──
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # ── Timeouts ──
    keepalive_timeout   65;
    client_body_timeout 30;
    client_header_timeout 30;
    send_timeout 30;

    # ── Buffer sizes ──
    client_max_body_size 15M;  # Match Fastify's multipart limit (10MB + overhead)

    # ── GZIP Compression ──
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Logging ──
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    access_log /var/log/nginx/codas_access.log main buffer=16k flush=5s;
    error_log  /var/log/nginx/codas_error.log warn;

    # ── Rate Limiting Zones ──
    # General: 20 requests/second per IP (burst allows short spikes)
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    # Auth: 5 requests/second per IP (login/signup abuse prevention)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    # Admin: 1 request/second per IP
    limit_req_zone $binary_remote_addr zone=admin:10m rate=1r/s;

    # ── Load Balancer: Backend (Node.js / Fastify) ──
    # Scale horizontally by adding more backend instances
    upstream backend_cluster {
        least_conn;  # Route to the instance with fewest active connections

        server 127.0.0.1:3000;
        # ── Add more instances when scaling ──
        # server 127.0.0.1:3001;
        # server 127.0.0.1:3002;
        # server 127.0.0.1:3003;

        keepalive 64;  # Persistent connections to backend (reduces TCP handshake overhead)
    }

    # ── Load Balancer: Python Service ──
    upstream python_cluster {
        least_conn;

        server 127.0.0.1:8001;
        # ── Add more instances when scaling ──
        # server 127.0.0.1:8002;

        keepalive 16;
    }

    # ── HTTP → HTTPS redirect (uncomment when SSL is ready) ──
    # server {
    #     listen 80;
    #     server_name app.codas.in;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80;
        # listen 443 ssl http2;  # Uncomment after certbot setup
        server_name app.codas.me; # Your actual domain

        # ── SSL (uncomment after running: sudo certbot --nginx) ──
        # ssl_certificate     /etc/letsencrypt/live/app.codas.me/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/app.codas.me/privkey.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;
        # ssl_prefer_server_ciphers on;
        # ssl_session_cache   shared:SSL:10m;
        # ssl_session_timeout 10m;

        # ── Security Headers ──
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ─────────────────────────────────────────────
        # 1. Frontend SPA (Static Files)
        # ─────────────────────────────────────────────
        location / {
            root /var/www/codas/frontend/dist;
            index index.html;

            # SPA routing: fallback to index.html for client-side routes
            try_files $uri $uri/ /index.html;

            # Cache static assets aggressively (Vite hashes filenames)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # ─────────────────────────────────────────────
        # 2. API Proxy → Backend Cluster
        # ─────────────────────────────────────────────
        location /api/ {
            limit_req zone=general burst=40 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";  # Enable keepalive to upstream
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (for future real-time features)
            proxy_set_header Upgrade $http_upgrade;
            proxy_cache_bypass $http_upgrade;

            # Timeouts for slow API calls (e.g. AI report generation)
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;
        }

        # ── Stricter rate limit on auth endpoints ──
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─────────────────────────────────────────────
        # 3. Admin Routes (IP-restricted)
        # ─────────────────────────────────────────────
        location /admin/ {
            limit_req zone=admin burst=3 nodelay;

            # IMPORTANT: Restrict to your office/VPN IP in production
            # allow 203.0.113.0/24;
            # deny all;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─────────────────────────────────────────────
        # 4. Python Internal Service (blocked from public)
        # ─────────────────────────────────────────────
        location /internal/ {
            # Only allow requests from the backend (localhost)
            allow 127.0.0.1;
            deny all;

            proxy_pass http://python_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 300s;  # PDF generation can be slow
        }

        # ── Block common attack vectors ──
        location ~ /\. { deny all; access_log off; log_not_found off; }
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }
    }
}
