name: Deploy Fullstack Monorepo to Azure

on:
  push:
    branches:
      - main

jobs:
  # JOB 1: Build and Deploy Fastify Backend
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'assetmap/backend/package-lock.json'

    # Build and bundle backend code
    - name: Install & Compile Backend
      run: |
        cd assetmap/backend
        npm ci
        npm run build

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # Deploy the entire backend folder (which now has built /dist files)
    - name: Deploy Backend to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'codas-api-prod' # Your Azure Web App name
        package: './assetmap/backend'

  # JOB 2: Build and Deploy Vite Frontend
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # SWA Action automatically handles dependency installs & build steps
    - name: Deploy Frontend to Azure Static Web App
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        action: "upload"
        app_location: "/assetmap/frontend" # Where frontend source is located
        api_location: "" # No Azure functions in this repo
        output_location: "dist" # Folder where Vite outputs build
