
services:
  postgres:
    image: postgres:15
    container_name: assetmap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: assetmap
      POSTGRES_PASSWORD: assetmap_dev_password
      POSTGRES_DB: assetmap
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/db/migrations/004_land_records.sql:/docker-entrypoint-initdb.d/02-004_land_records.sql
      - ./backend/src/db/migrations/005_engagement_features.sql:/docker-entrypoint-initdb.d/03-005_engagement_features.sql
      - ./backend/src/db/migrations/005_net_worth_history.sql:/docker-entrypoint-initdb.d/04-005_net_worth_history.sql
      - ./backend/src/db/migrations/006_phase2_features.sql:/docker-entrypoint-initdb.d/05-006_phase2_features.sql
      - ./backend/src/db/migrations/009_b2b_api.sql:/docker-entrypoint-initdb.d/06-009_b2b_api.sql
      - ./backend/src/db/migrations/010_recovery_engine.sql:/docker-entrypoint-initdb.d/07-010_recovery_engine.sql
      - ./backend/src/db/migrations/011_fix_missing_enums_columns.sql:/docker-entrypoint-initdb.d/08-011_fix_missing_enums.sql
      - ./backend/src/db/migrations/011_plans_billing.sql:/docker-entrypoint-initdb.d/09-011_plans_billing.sql
      - ./backend/src/db/migrations/012_subscription_tiers.sql:/docker-entrypoint-initdb.d/10-012_subscription_tiers.sql
      - ./backend/src/db/migrations/013_nomination_requests.sql:/docker-entrypoint-initdb.d/11-013_nomination_requests.sql
      - ./backend/src/db/migrations/014_nominee_update.sql:/docker-entrypoint-initdb.d/12-014_nominee_update.sql
      - ./backend/src/db/migrations/015_canonical_assets.sql:/docker-entrypoint-initdb.d/13-015_canonical_assets.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U assetmap']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - assetmap-internal

  redis:
    image: redis:7-alpine
    container_name: assetmap-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - assetmap-internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assetmap-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://assetmap:assetmap_dev_password@postgres:5432/assetmap
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5173
      PYTHON_SERVICE_URL: http://python-service:8001
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/.env:/app/.env
    command: npm run dev
    networks:
      - assetmap-internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assetmap-frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev -- --host 0.0.0.0
    networks:
      - assetmap-internal

  python-service:
    build: ./python-service
    container_name: assetmap-python
    ports:
      - "8001:8001"
    volumes:
      - ./python-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    networks:
      - assetmap-internal
    restart: unless-stopped

networks:
  assetmap-internal:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
