name: Deploy Fullstack Monorepo to Azure

on:
  push:
    branches:
      - main

jobs:
  # JOB 1: Build, Push Container, and Deploy to Azure Web App
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set lower case image tag
      run: |
        echo "IMAGE_TAG=ghcr.io/${GITHUB_REPOSITORY,,}/backend:latest" >> $GITHUB_ENV

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./assetmap/backend
        file: ./assetmap/backend/Dockerfile
        push: true
        tags: ${{ env.IMAGE_TAG }}

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy Container to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'codas-api-prod'
        images: ${{ env.IMAGE_TAG }}

  # JOB 2: Build and Deploy Vite Frontend
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # SWA Action automatically handles dependency installs & build steps
    - name: Deploy Frontend to Azure Static Web App
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        action: "upload"
        app_location: "/assetmap/frontend" # Where frontend source is located
        api_location: "" # No Azure functions in this repo
        output_location: "dist" # Folder where Vite outputs build
      env:
        VITE_API_URL: 'https://codas-api-prod-d2d3ajedgpb5bpcx.centralindia-01.azurewebsites.net'
